name: Discord Report

on:
  # schedule:
  #   # Scheduled runs migrated to cron-job.org (Account: jayalathmegha@gmail.com) to avoid GitHub Actions cron drift.
  #   # ~10:00 AM Asia/Colombo (UTC+5:30) on Sunday to Friday
  #   - cron: '30 4 * * 0-5'
  workflow_dispatch:  # Allows manual trigger from GitHub UI / API
    inputs:
      force:
        description: 'Force dispatch all reports regardless of the day.'
        required: false
        default: 'false'
        type: boolean

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Clockify bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FULL_TIME_ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.FULL_TIME_ANNOUNCEMENTS_CHANNEL_ID }}
          PROJECT_MANAGEMENT_CHANNEL_ID: ${{ secrets.PROJECT_MANAGEMENT_CHANNEL_ID }}
          CLOCKIFY_API_KEY: ${{ secrets.CLOCKIFY_API_KEY }}
          CLOCKIFY_WORKSPACE_ID: ${{ secrets.CLOCKIFY_WORKSPACE_ID }}
          GENERAL_CHANNEL_ID: ${{ secrets.GENERAL_CHANNEL_ID }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          if [ "${{ inputs.force }}" == "true" ]; then
            node trigger.js
          else
            node index.js
          fi