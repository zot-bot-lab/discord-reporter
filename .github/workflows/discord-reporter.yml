name: Discord Report

on:
  # Scheduled runs migrated to cron-job.org (Account: jayalathmegha@gmail.com) to avoid GitHub Actions cron drift.
  # Triggered externally via GitHub API (workflow_dispatch or repository_dispatch).
  workflow_dispatch:  # Allows trigger from GitHub UI or API
    inputs:
      force:
        description: 'Force dispatch all reports regardless of the day.'
        required: false
        default: false
        type: boolean
  repository_dispatch:  # Allows external webhooks (e.g., cron-job.org) to trigger the workflow
    types: [cron_trigger, force_trigger]

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Solidtime bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FULL_TIME_ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.FULL_TIME_ANNOUNCEMENTS_CHANNEL_ID }}
          PROJECT_MANAGEMENT_CHANNEL_ID: ${{ secrets.PROJECT_MANAGEMENT_CHANNEL_ID }}
          SOLIDTIME_API_TOKEN: ${{ secrets.SOLIDTIME_API_TOKEN }}
          SOLIDTIME_ORGANIZATION_ID: ${{ secrets.SOLIDTIME_ORGANIZATION_ID }}
          SOLIDTIME_API_URL: ${{ secrets.SOLIDTIME_API_URL }}
          GENERAL_CHANNEL_ID: ${{ secrets.GENERAL_CHANNEL_ID }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          if [ "${{ inputs.force }}" == "true" ] || [ "${{ github.event.action }}" == "force_trigger" ]; then
            node trigger.js
          else
            node index.js
          fi